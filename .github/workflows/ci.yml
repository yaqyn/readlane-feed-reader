name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: gator
          POSTGRES_PASSWORD: gator-test
          POSTGRES_DB: gator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gator -d gator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GATOR_TEST_DATABASE_URL: postgres://gator:gator-test@localhost:5432/gator_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install validation tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet, integration tests, generated queries and vulnerability scan
        run: make verify
      - name: Build and verify the executable on a fresh database
        run: make smoke VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gator-linux-amd64
          path: gator
          if-no-files-found: error
