name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: readlane
          POSTGRES_PASSWORD: readlane-test
          POSTGRES_DB: readlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readlane -d readlane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      READLANE_TEST_DATABASE_URL: postgres://readlane:readlane-test@localhost:5432/readlane_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Check the companion reader
        run: |
          npm ci --ignore-scripts
          make web-check
      - name: Install validation tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet, integration tests, generated queries and vulnerability scan
        run: make verify
      - name: Build and verify the executable on a fresh database
        env:
          READLANE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Use the service's matching clients instead of the runner's older pg_dump.
          client_bin="$RUNNER_TEMP/readlane-postgres-bin"
          mkdir -p "$client_bin"
          for tool in psql pg_dump pg_restore; do
            cat > "$client_bin/$tool" <<'CLIENT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e PGSSLMODE -e PGOPTIONS \
            "$READLANE_POSTGRES_CONTAINER" "$(basename "$0")" "$@"
          CLIENT
            chmod +x "$client_bin/$tool"
          done
          export PATH="$client_bin:$PATH"
          pg_dump --version
          make smoke VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readlane-linux-amd64
          path: readlane
          if-no-files-found: error
